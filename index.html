<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mobber: Three Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
  #fire { position: fixed; right: 22px; bottom: 22px; width: 88px; height: 88px; border-radius: 50%; display: none;
    border: 2px solid rgba(236,230,218,0.7); background: rgba(236,230,218,0.12); color: #ece6da;
    font: 15px "Special Elite", monospace; letter-spacing: 2px; }
  #swap { position: fixed; right: 124px; bottom: 34px; width: 64px; height: 64px; border-radius: 50%; display: none;
    border: 2px solid rgba(236,230,218,0.5); background: rgba(236,230,218,0.08); color: #ece6da; font: 12px "Special Elite", monospace; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="fire">FIRE</button>
<button id="swap">SWAP</button>
<script>
(() => {
  "use strict";
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const W = 640, H = 360, HALF = H / 2, PLANE = 0.75, K = (W / 2) / PLANE;
  const buf = document.createElement("canvas"); buf.width = W; buf.height = H;
  const bctx = buf.getContext("2d");
  const img = bctx.createImageData(W, H);
  const out = new Uint32Array(img.data.buffer);
  const luma = new Float32Array(W * H);
  const zbuf = new Float32Array(W);
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const isTouch = matchMedia("(pointer: coarse)").matches;
  const DECO = "Limelight, serif", SERIF = "'Playfair Display', Georgia, serif", TYPE = "'Special Elite', 'Courier New', monospace";
  const CREAM = "#ece6da";

  let vw = 0, vh = 0, dpr = 1, film = { x: 0, y: 0, w: 0, h: 0 };
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    vw = window.innerWidth; vh = window.innerHeight;
    cv.width = vw * dpr; cv.height = vh * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // Letterboxed 16:9 frame, like a projected reel
    const s = Math.min(vw / W, vh / H);
    film = { w: W * s, h: H * s, x: (vw - W * s) / 2, y: (vh - H * s) / 2, s };
  }
  window.addEventListener("resize", resize);
  resize();
  if (document.fonts) ["16px Limelight", "italic 700 16px 'Playfair Display'", "900 16px 'Playfair Display'", "16px 'Special Elite'"]
    .forEach(f => document.fonts.load(f).catch(() => {}));

  // ---------- Film stock ----------
  const LUT = new Uint32Array(256);
  for (let v = 0; v < 256; v++) {
    const b = 9 + v * 0.95;
    const r = Math.min(255, b), g = Math.min(255, b * 0.97), bl = Math.min(255, b * 0.9);
    LUT[v] = (255 << 24) | ((bl | 0) << 16) | ((g | 0) << 8) | (r | 0);
  }
  const GRAIN = new Float32Array(256 * 256);
  for (let i = 0; i < GRAIN.length; i++) GRAIN[i] = (Math.random() + Math.random() + Math.random() - 1.5) * 20;
  const VIG = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const dx = (x - W / 2) / (W / 2), dy = (y - H / 2) / (H / 2);
    VIG[y * W + x] = clamp(1.1 - 0.32 * Math.pow(dx * dx * 0.8 + dy * dy, 1.3), 0, 1.12);
  }
  const noiseCv = document.createElement("canvas"); noiseCv.width = 640; noiseCv.height = 360;
  { const g = noiseCv.getContext("2d"), d = g.createImageData(640, 360);
    for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
    g.putImageData(d, 0, 0); }

  // ---------- Procedural art ----------
  const gray = v => { v = clamp(v | 0, 0, 255); return `rgb(${v},${v},${v})`; };
  function bitmap(w, h, draw) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d"); draw(g, w, h);
    const d = g.getImageData(0, 0, w, h).data, L = new Uint8Array(w * h), A = new Uint8Array(w * h);
    for (let i = 0; i < w * h; i++) { A[i] = d[i * 4 + 3]; L[i] = d[i * 4] * 0.3 + d[i * 4 + 1] * 0.59 + d[i * 4 + 2] * 0.11; }
    return { w, h, L, A };
  }
  function speckle(g, w, h, n, a) {
    for (let i = 0; i < n; i++) { const c = Math.random() < 0.5 ? 0 : 255; g.fillStyle = `rgba(${c},${c},${c},${a * Math.random()})`; g.fillRect(Math.random() * w, Math.random() * h, 1, 1); }
  }

  const TEX = {
    brick: bitmap(64, 64, g => {
      g.fillStyle = gray(48); g.fillRect(0, 0, 64, 64);
      for (let r = 0; r < 8; r++) { const off = r % 2 ? 8 : 0; for (let c = -1; c < 4; c++) { g.fillStyle = gray(92 + rand(-20, 22)); g.fillRect(c * 16 + off + 1, r * 8 + 1, 14, 6); } }
      speckle(g, 64, 64, 700, 0.35);
    }),
    paper: bitmap(64, 64, g => {
      g.fillStyle = gray(150); g.fillRect(0, 0, 64, 64);
      for (let x = 0; x < 64; x += 8) { g.fillStyle = gray(165); g.fillRect(x, 0, 2, 46); }
      g.strokeStyle = gray(105); g.lineWidth = 1;
      for (let y = 4; y < 44; y += 16) for (let x = 0; x < 64; x += 16) {
        g.beginPath(); g.moveTo(x + 8, y); g.lineTo(x + 13, y + 6); g.lineTo(x + 8, y + 12); g.lineTo(x + 3, y + 6); g.closePath(); g.stroke();
        g.fillStyle = gray(120); g.fillRect(x + 7, y + 5, 2, 2);
      }
      g.fillStyle = gray(62); g.fillRect(0, 46, 64, 18);
      g.fillStyle = gray(118); g.fillRect(0, 45, 64, 3);
      g.fillStyle = gray(45); for (let x = 0; x < 64; x += 16) g.fillRect(x, 50, 1, 14);
      speckle(g, 64, 64, 300, 0.2);
    }),
    panel: bitmap(64, 64, g => {
      g.fillStyle = gray(86); g.fillRect(0, 0, 64, 64);
      for (let x = 0; x < 64; x += 16) { g.fillStyle = gray(52); g.fillRect(x, 0, 1, 64); }
      g.strokeStyle = "rgba(30,30,30,0.35)";
      for (let i = 0; i < 18; i++) { const x = rand(0, 64); g.beginPath(); g.moveTo(x, 0); g.bezierCurveTo(x + rand(-4, 4), 20, x + rand(-4, 4), 44, x + rand(-3, 3), 64); g.stroke(); }
      g.fillStyle = gray(124); g.fillRect(0, 28, 64, 3);
      g.strokeStyle = gray(60); g.lineWidth = 2; g.strokeRect(4, 36, 24, 24); g.strokeRect(36, 36, 24, 24); g.strokeRect(4, 4, 24, 20); g.strokeRect(36, 4, 24, 20);
    }),
    bar: bitmap(64, 64, g => {
      g.fillStyle = gray(32); g.fillRect(0, 0, 64, 64);
      for (const sy of [22, 42]) {
        let x = 2;
        while (x < 60) {
          const bw = rand(4, 6), bh = rand(10, 15), v = rand(70, 215);
          g.fillStyle = gray(v); g.fillRect(x, sy - bh, bw, bh); g.fillRect(x + bw / 2 - 1, sy - bh - 4, 2, 4);
          g.fillStyle = gray(Math.min(255, v + 40)); g.fillRect(x + 1, sy - bh + 2, 1, bh - 4);
          x += bw + rand(1, 3);
        }
        g.fillStyle = gray(140); g.fillRect(0, sy, 64, 3);
      }
      g.fillStyle = gray(88); g.fillRect(0, 50, 64, 14); g.fillStyle = gray(150); g.fillRect(0, 50, 64, 2);
    }),
    deco: bitmap(64, 64, g => {
      g.fillStyle = gray(200); g.fillRect(0, 0, 64, 64);
      for (let i = 0; i < 9; i++) {
        const a0 = Math.PI + i * Math.PI / 9, a1 = a0 + Math.PI / 18;
        g.fillStyle = gray(i % 2 ? 70 : 140); g.beginPath(); g.moveTo(32, 64);
        g.lineTo(32 + Math.cos(a0) * 70, 64 + Math.sin(a0) * 70); g.lineTo(32 + Math.cos(a1) * 70, 64 + Math.sin(a1) * 70); g.fill();
      }
      g.fillStyle = gray(230); g.beginPath(); g.arc(32, 64, 12, Math.PI, 0); g.fill();
      g.fillStyle = gray(40); g.fillRect(0, 0, 64, 3); g.fillRect(0, 61, 64, 3); g.fillRect(0, 0, 2, 64);
    }),
    door: bitmap(64, 64, g => {
      g.fillStyle = gray(30); g.fillRect(0, 0, 64, 64);
      g.fillStyle = gray(112); g.fillRect(10, 4, 44, 60);
      g.strokeStyle = gray(70); g.lineWidth = 2; g.strokeRect(16, 20, 32, 16); g.strokeRect(16, 42, 32, 18);
      g.fillStyle = gray(225); g.beginPath(); g.arc(47, 41, 2.5, 0, 6.283); g.fill();
      g.fillStyle = gray(15); g.fillRect(18, 7, 28, 10);
      g.fillStyle = gray(240); g.font = "bold 8px monospace"; g.textAlign = "center"; g.fillText("EXIT", 32, 15);
    }),
  };
  const FLOORS = {
    checker: bitmap(64, 64, g => {
      for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) { g.fillStyle = gray((x + y) % 2 ? 36 : 196); g.fillRect(x * 16, y * 16, 16, 16); }
      g.fillStyle = gray(110); for (let i = 0; i <= 64; i += 16) { g.fillRect(i, 0, 1, 64); g.fillRect(0, i, 64, 1); }
      speckle(g, 64, 64, 400, 0.3);
    }),
    concrete: bitmap(64, 64, g => {
      g.fillStyle = gray(96); g.fillRect(0, 0, 64, 64); speckle(g, 64, 64, 1600, 0.35);
      g.strokeStyle = gray(60); g.beginPath(); g.moveTo(5, 10); g.lineTo(20, 22); g.lineTo(26, 40); g.stroke();
      g.fillStyle = gray(70); g.fillRect(0, 0, 64, 1); g.fillRect(0, 0, 1, 64);
    }),
    carpet: bitmap(64, 64, g => {
      g.fillStyle = gray(58); g.fillRect(0, 0, 64, 64);
      g.strokeStyle = gray(95); g.lineWidth = 2;
      for (let y = 0; y < 64; y += 32) for (let x = 0; x < 64; x += 32) {
        g.beginPath(); g.moveTo(x + 16, y + 2); g.lineTo(x + 30, y + 16); g.lineTo(x + 16, y + 30); g.lineTo(x + 2, y + 16); g.closePath(); g.stroke();
        g.fillStyle = gray(120); g.fillRect(x + 14, y + 14, 4, 4);
      }
      speckle(g, 64, 64, 500, 0.25);
    }),
  };
  const CEILS = {
    tin: bitmap(64, 64, g => {
      g.fillStyle = gray(118); g.fillRect(0, 0, 64, 64);
      for (let y = 0; y < 64; y += 16) for (let x = 0; x < 64; x += 16) {
        g.fillStyle = gray(150); g.fillRect(x + 2, y + 2, 12, 2); g.fillRect(x + 2, y + 2, 2, 12);
        g.fillStyle = gray(80); g.fillRect(x + 2, y + 12, 12, 2); g.fillRect(x + 12, y + 2, 2, 12);
      }
    }),
    beams: bitmap(64, 64, g => {
      g.fillStyle = gray(40); g.fillRect(0, 0, 64, 64);
      g.fillStyle = gray(78); g.fillRect(0, 0, 64, 10); g.fillRect(0, 32, 64, 10);
      g.fillStyle = gray(25); g.fillRect(0, 10, 64, 2); g.fillRect(0, 42, 64, 2);
      speckle(g, 64, 64, 300, 0.3);
    }),
    plaster: bitmap(64, 64, g => {
      g.fillStyle = gray(150); g.fillRect(0, 0, 64, 64); speckle(g, 64, 64, 600, 0.15);
      g.strokeStyle = gray(120); g.strokeRect(0.5, 0.5, 63, 63);
    }),
  };

  // People, drawn facing the camera
  function person(g, o, pose) {
    const cx = 32;
    g.save();
    if (o.wide) { g.translate(cx, 64); g.scale(1.18, 1); g.translate(-cx, -64); }
    if (pose === "hurt") { g.translate(cx, 64); g.rotate(0.12); g.translate(-cx, -64); }
    g.fillStyle = gray(o.pants); g.fillRect(cx - 7, 46, 5, 16); g.fillRect(cx + 2, 46, 5, 16);
    g.fillStyle = gray(18); g.fillRect(cx - 8, 61, 7, 3); g.fillRect(cx + 1, 61, 7, 3);
    g.fillStyle = gray(o.coat); g.beginPath(); g.moveTo(cx - 10, 19); g.lineTo(cx + 10, 19); g.lineTo(cx + 12, 52); g.lineTo(cx - 12, 52); g.closePath(); g.fill();
    if (o.stripes) { g.strokeStyle = "rgba(255,255,255,0.18)"; g.lineWidth = 0.6; for (let x = -10; x <= 10; x += 3) { g.beginPath(); g.moveTo(cx + x, 20); g.lineTo(cx + x * 1.15, 52); g.stroke(); } }
    g.fillStyle = gray(228); g.beginPath(); g.moveTo(cx - 3, 19); g.lineTo(cx + 3, 19); g.lineTo(cx, 30); g.fill();
    g.fillStyle = gray(o.tie); g.fillRect(cx - 1, 20, 2, 9);
    g.strokeStyle = gray(o.coat - 35); g.lineWidth = 1; g.beginPath(); g.moveTo(cx, 30); g.lineTo(cx, 52); g.stroke();
    g.fillStyle = gray(o.skin); g.beginPath(); g.ellipse(cx, 13.5, 5, 6, 0, 0, 6.283); g.fill();
    g.fillStyle = gray(o.skin - 85); g.fillRect(cx - 5, 10, 10, 3);
    g.fillStyle = gray(o.hat); g.fillRect(cx - 9, 7.5, 18, 3);
    g.beginPath(); g.moveTo(cx - 6, 8); g.lineTo(cx - 5, 1); g.lineTo(cx + 5, 1); g.lineTo(cx + 6, 8); g.fill();
    g.fillStyle = gray(o.band); g.fillRect(cx - 6, 5.5, 12, 2);
    if (o.cigar) { g.fillStyle = gray(90); g.fillRect(cx + 1, 16, 5, 1.5); g.fillStyle = gray(255); g.fillRect(cx + 6, 15.6, 1.5, 2); }
    // Arms and the gun
    g.fillStyle = gray(o.coat - 12);
    if (pose === "aim" || pose === "fire") {
      g.fillRect(cx - 11, 22, 5, 12); g.fillRect(cx + 6, 22, 5, 12);
      g.fillStyle = gray(o.skin); g.fillRect(cx - 5, 31, 4, 3); g.fillRect(cx + 1, 29, 4, 3);
      if (o.weapon === "tommy") { g.fillStyle = gray(24); g.beginPath(); g.arc(cx, 34, 5, 0, 6.283); g.fill(); g.fillStyle = gray(70); g.beginPath(); g.arc(cx - 1, 33, 1.6, 0, 6.283); g.fill(); }
      g.fillStyle = gray(30); g.fillRect(cx - 2.5, 25, 5, 6);
      g.fillStyle = gray(5); g.beginPath(); g.arc(cx, 27, 1.6, 0, 6.283); g.fill();
      if (pose === "fire") {
        g.fillStyle = gray(255);
        g.beginPath();
        for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, r = i % 2 ? 4 : 11; g.lineTo(cx + Math.cos(a) * r, 26 + Math.sin(a) * r); }
        g.closePath(); g.fill();
      }
    } else {
      g.fillRect(cx - 12, 21, 4, 18); g.fillRect(cx + 8, 21, 4, 16);
      g.save(); g.translate(cx, 36); g.rotate(pose === "hurt" ? 0.6 : -0.45);
      g.fillStyle = gray(26);
      if (o.weapon === "tommy") { g.fillRect(-13, -2, 26, 4); g.beginPath(); g.arc(-2, 3, 4, 0, 6.283); g.fill(); g.fillRect(-16, -1, 4, 6); }
      else if (o.weapon === "shotgun") { g.fillRect(-15, -1.5, 30, 3); g.fillRect(-16, -1, 6, 6); }
      else { g.fillRect(4, -2, 8, 3); g.fillRect(4, 0, 3, 5); }
      g.restore();
      g.fillStyle = gray(o.skin); g.fillRect(cx - 12, 37, 4, 3); g.fillRect(cx + 8, 35, 4, 3);
    }
    g.restore();
  }
  function personSet(o) {
    const f = pose => bitmap(64, 64, g => person(g, o, pose));
    return {
      idle: f("idle"), aim: f("aim"), fire: f("fire"), hurt: f("hurt"),
      fall: bitmap(64, 64, g => { g.translate(32, 64); g.rotate(-0.85); g.translate(-32, -64); person(g, o, "hurt"); }),
      dead: bitmap(64, 64, g => {
        g.fillStyle = gray(o.coat); g.beginPath(); g.ellipse(30, 58, 20, 5, 0, 0, 6.283); g.fill();
        g.fillStyle = gray(o.pants); g.fillRect(44, 56, 14, 4);
        g.fillStyle = gray(o.skin); g.beginPath(); g.ellipse(10, 57, 4, 3.5, 0, 0, 6.283); g.fill();
        g.fillStyle = gray(o.hat); g.beginPath(); g.ellipse(4, 61, 6, 2.5, 0, 0, 6.283); g.fill();
      }),
    };
  }
  const GOON = personSet({ coat: 74, hat: 34, band: 14, pants: 48, tie: 28, skin: 168, weapon: "tommy" });
  const HEAVY = personSet({ coat: 182, hat: 200, band: 40, pants: 66, tie: 40, skin: 160, weapon: "shotgun", wide: true });
  const BOSS = personSet({ coat: 30, hat: 232, band: 18, pants: 30, tie: 232, skin: 172, weapon: "pistol", stripes: true, cigar: true, wide: true });

  const OBJ = {
    table: bitmap(64, 64, g => {
      g.fillStyle = gray(212); g.beginPath(); g.moveTo(14, 40); g.lineTo(50, 40); g.lineTo(54, 63); g.lineTo(10, 63); g.closePath(); g.fill();
      g.strokeStyle = gray(170); for (let x = 16; x < 50; x += 6) { g.beginPath(); g.moveTo(x, 42); g.lineTo(x - 2 + (x - 32) * 0.1, 63); g.stroke(); }
      g.fillStyle = gray(235); g.beginPath(); g.ellipse(32, 40, 19, 3, 0, 0, 6.283); g.fill();
      g.fillStyle = gray(60); g.fillRect(31, 30, 2, 9); g.fillStyle = gray(250); g.beginPath(); g.moveTo(26, 31); g.lineTo(38, 31); g.lineTo(35, 24); g.lineTo(29, 24); g.fill();
      g.fillStyle = gray(90); g.fillRect(41, 31, 3, 8); g.fillRect(41.8, 28, 1.4, 3);
    }),
    crate: bitmap(64, 64, g => {
      g.fillStyle = gray(118); g.fillRect(8, 18, 48, 46);
      g.fillStyle = gray(80); for (let y = 18; y < 64; y += 9) g.fillRect(8, y, 48, 1);
      g.strokeStyle = gray(70); g.lineWidth = 3; g.strokeRect(9.5, 19.5, 45, 43); g.beginPath(); g.moveTo(10, 20); g.lineTo(54, 62); g.stroke();
      g.fillStyle = gray(30); g.font = "bold 10px monospace"; g.textAlign = "center"; g.fillText("RYE", 22, 34);
    }),
    piano: bitmap(64, 64, g => {
      g.fillStyle = gray(24); g.fillRect(4, 16, 56, 48);
      g.fillStyle = gray(56); g.fillRect(4, 16, 56, 4);
      g.fillStyle = gray(225); g.fillRect(6, 38, 52, 6);
      g.fillStyle = gray(20); for (let x = 8; x < 58; x += 4) if ((x / 4 | 0) % 7 !== 2 && (x / 4 | 0) % 7 !== 6) g.fillRect(x, 38, 2, 4);
      g.fillStyle = gray(200); g.fillRect(24, 22, 16, 10); g.fillStyle = gray(120); for (let y = 24; y < 31; y += 2) g.fillRect(26, y, 12, 1);
    }),
    lamp: bitmap(64, 64, g => {
      g.fillStyle = gray(40); g.fillRect(31, 18, 2, 44); g.beginPath(); g.ellipse(32, 62, 8, 2, 0, 0, 6.283); g.fill();
      g.fillStyle = gray(250); g.beginPath(); g.moveTo(24, 20); g.lineTo(40, 20); g.lineTo(36, 6); g.lineTo(28, 6); g.closePath(); g.fill();
      g.fillStyle = gray(200); g.fillRect(24, 19, 16, 2);
    }),
    hanging: bitmap(64, 64, g => {
      g.fillStyle = gray(30); g.fillRect(31.5, 0, 1, 22);
      g.fillStyle = gray(70); g.beginPath(); g.moveTo(32, 20); g.lineTo(44, 30); g.lineTo(20, 30); g.closePath(); g.fill();
      g.fillStyle = gray(255); g.beginPath(); g.arc(32, 31, 4, 0, 6.283); g.fill();
    }),
    barrel: bitmap(64, 64, g => {
      g.fillStyle = gray(76); g.beginPath(); g.ellipse(32, 42, 15, 22, 0, 0, 6.283); g.fill();
      g.fillStyle = gray(40); g.fillRect(16, 28, 32, 3); g.fillRect(16, 52, 32, 3);
      g.fillStyle = gray(110); g.fillRect(24, 22, 3, 38);
    }),
    cash: bitmap(64, 64, g => {
      for (let i = 0; i < 3; i++) { g.fillStyle = gray(150 - i * 10); g.fillRect(20 + i * 2, 52 - i * 4, 22, 6); g.fillStyle = gray(240); g.fillRect(29 + i * 2, 52 - i * 4, 4, 6); }
      g.fillStyle = gray(30); g.font = "bold 7px monospace"; g.fillText("$", 23, 50);
    }),
    medkit: bitmap(64, 64, g => {
      g.fillStyle = gray(225); g.fillRect(20, 46, 24, 17); g.fillStyle = gray(40); g.fillRect(30, 49, 4, 11); g.fillRect(26, 53, 12, 3);
      g.fillStyle = gray(150); g.fillRect(28, 43, 8, 3);
    }),
    ammo: bitmap(64, 64, g => {
      g.fillStyle = gray(34); g.beginPath(); g.arc(32, 52, 10, 0, 6.283); g.fill();
      g.strokeStyle = gray(110); g.lineWidth = 1.5; g.beginPath(); g.arc(32, 52, 7, 0, 6.283); g.stroke();
      g.fillStyle = gray(150); g.beginPath(); g.arc(32, 52, 2, 0, 6.283); g.fill();
    }),
    ledger: bitmap(64, 64, g => {
      g.fillStyle = gray(235); g.fillRect(21, 50, 22, 4);
      g.fillStyle = gray(36); g.fillRect(20, 44, 24, 7); g.fillStyle = gray(200); g.fillRect(23, 46, 18, 1);
      g.fillStyle = gray(36); g.fillRect(20, 53, 24, 3);
    }),
  };

  // First-person weapons
  function muzzleFlash(g, x, y, big) {
    g.fillStyle = gray(255); g.beginPath();
    for (let i = 0; i < 20; i++) { const a = Math.PI + (i - 10) * 0.16, r = i % 2 ? big * 0.3 : big; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }

  }

  function fire() {
    const p = player, w = WEAP[p.weapon];
    if (p.reload > 0 || p.fireCd > 0) return;
    if (p.mag[p.weapon] <= 0) { SND.click(); p.fireCd = 0.25; startReload(); return; }
    p.mag[p.weapon]--; p.fireCd = w.rate; p.recoil = 1; p.flash = 0.06; stats.shots++;
    p.weapon === 0 ? SND.rev() : SND.tommy();
    for (const e of enemies) if (e.hp > 0 && Math.hypot(e.x - p.x, e.y - p.y) < 12) e.alert = true;
    const spread = w.spread * (p.moving ? 1.6 : 1);
    const col = clamp((W / 2 + rand(-spread, spread)) | 0, 0, W - 1);
    const t = hitscan(col);
    if (t) {
      stats.hits++;
      t.hp -= w.dmg * rand(0.85, 1.15);
      t.alert = true; t.lx = p.x; t.ly = p.y;
      if (t.hp <= 0) {
        t.state = "dying"; t.t = 0.5; stats.kills++; SND.down();
        if (Math.random() < 0.5) objs.push({ x: t.x, y: t.y, art: player.has[1] ? OBJ.ammo : OBJ.cash, scale: 0.6, pick: player.has[1] ? "ammo" : "cash" });
        if (t.type === ETYPE.V) say("Don Vitale is finished. Get to the exit.", 4);
      } else if (t.state !== "aim" || Math.random() < 0.4) { t.state = "hurt"; t.t = 0.18; }

  let dirX = 1, dirY = 0, planeX = 0, planeY = PLANE;
  function camera() { dirX = Math.cos(player.a); dirY = Math.sin(player.a); planeX = -dirY * PLANE; planeY = dirX * PLANE; }

  function updateEnemy(e, dt) {
    const p = player, T = e.type;

    if (e.state === "dead") return;
    e.cd -= dt;

    const sees = d < 16 && los(e.x, e.y, p.x, p.y);
    if (sees) { e.alert = true; e.lx = p.x; e.ly = p.y; }
    e.moving = false;
    switch (e.state) {

  function enemyShoot(e, d, sees) {

    if (Math.random() > chance) return;

  function update(dt) {
    const p = player;
    timer += dt; stats.time += dt;
    camera();
    let fw = 0, st = 0, turn = 0;
    if (keys.has("w") || keys.has("arrowup")) fw += 1;
    if (keys.has("s") || keys.has("arrowdown")) fw -= 1;
    if (keys.has("a")) st -= 1;
    if (keys.has("d")) st += 1;
    if (keys.has("arrowleft")) turn -= 1;
    if (keys.has("arrowright")) turn += 1;
    if (touch.move) { fw -= touch.move.dy; st += touch.move.dx; }
    p.a += turn * 2.4 * dt;
    const m = Math.hypot(fw, st), speed = keys.has("shift") ? 4.2 : 3.2;
    if (m > 0.05) {

      else if (o.pick === "cash") { const v = Math.round(rand(1, 5)) * 100; stats.cash += v; say(`+$${v}`); }
      else if (o.pick === "ammo") {
        if (!p.has[1]) { p.has[1] = true; p.weapon = 1; p.mag[1] = 50; say("A Tommy gun. Now we're talking.  [1/2 or Q to swap]", 3.5); }
        else { p.reserve += 50; say("+50 rounds"); }
      }
      else if (o.pick === "ledger") {
        p.ledger = true; say("Got the ledger. Now find the EXIT.", 3.5);
        for (const e of enemies) e.alert = true;

    }
    if (msg.t > 0) msg.t -= dt;
  }

  // ---------- Rendering ----------
  function renderWorld(t) {
    camera();
    const px = player.x, py = player.y, fl = FLOORS[lvl.floor].L, ce = CEILS[lvl.ceil].L;
    // Floor and ceiling
    for (let y = HALF + 1; y < H; y++) {
      const rowDist = (0.5 * K) / (y - HALF);
      const fog = Math.exp(-rowDist * 0.05);
      let fx = px + rowDist * (dirX - planeX), fy = py + rowDist * (dirY - planeY);
      const sx = rowDist * 2 * planeX / W, sy = rowDist * 2 * planeY / W;
      const rf = y * W, rc = (H - 1 - y) * W;
      for (let x = 0; x < W; x++) {
        const ti = ((((fy * 64) | 0) & 63) << 6) | (((fx * 64) | 0) & 63);
        const li = light[clamp((fy * LSUB) | 0, 0, LH - 1) * LW + clamp((fx * LSUB) | 0, 0, LW - 1)] * fog;
        luma[rf + x] = fl[ti] * li;

    }
    for (let x = 0; x < W; x++) luma[HALF * W + x] = 0;
    // Walls
    for (let x = 0; x < W; x++) {
      const camX = 2 * x / W - 1, rdx = dirX + planeX * camX, rdy = dirY + planeY * camX;
      let mx = px | 0, my = py | 0;
      const ddx = Math.abs(1 / rdx), ddy = Math.abs(1 / rdy);
      let stepX, stepY, sdx, sdy, side = 0;
      if (rdx < 0) { stepX = -1; sdx = (px - mx) * ddx; } else { stepX = 1; sdx = (mx + 1 - px) * ddx; }
      if (rdy < 0) { stepY = -1; sdy = (py - my) * ddy; } else { stepY = 1; sdy = (my + 1 - py) * ddy; }
      let c = ".";
      for (let n = 0; n < 64; n++) {
        if (sdx < sdy) { sdx += ddx; mx += stepX; side = 0; } else { sdy += ddy; my += stepY; side = 1; }
        c = (mx < 0 || my < 0 || mx >= MW || my >= MH) ? "#" : map[my][mx];

    }

  function drawSprite(s) {

  function drawGun(t) {

    for (let y = 0; y < art.h; y++) {

  function develop(bright) {
    const ox = (Math.random() * 256) | 0, oy = (Math.random() * 256) | 0;

  // Projector artifacts on top of the frame
  const scratches = [];
  function projector(intensity = 1) {
    if (Math.random() < 0.06 * intensity) scratches.push({ x: Math.random(), life: rand(0.1, 0.6), w: rand(0.5, 1.5), dark: Math.random() < 0.5 });
    ctx.save(); ctx.beginPath(); ctx.rect(film.x, film.y, film.w, film.h); ctx.clip();
    for (let i = scratches.length - 1; i >= 0; i--) {
      const s = scratches[i]; s.life -= 1 / 60; s.x += rand(-0.002, 0.002);

      ctx.fillRect(film.x + s.x * film.w, film.y, s.w, film.h);
    }
    const n = Math.random() < 0.3 * intensity ? (Math.random() * 3) | 0 : 0;
    for (let i = 0; i < n; i++) {
      const x = film.x + Math.random() * film.w, y = film.y + Math.random() * film.h;

  function drawHUD() {
    const p = player, f = film, s = f.s;
    const fs = n => Math.max(10, n * s);
    // Crosshair
    const cx = f.x + f.w / 2, cy = f.y + f.h / 2, g = 4 + p.recoil * 6;
    ctx.strokeStyle = "rgba(236,230,218,0.8)"; ctx.lineWidth = 1.5; ctx.beginPath();
    ctx.moveTo(cx - g - 6, cy); ctx.lineTo(cx - g, cy); ctx.moveTo(cx + g, cy); ctx.lineTo(cx + g + 6, cy);

    ctx.fillText(String(Math.ceil(p.hp)), f.x + 18 * s, base);

    ctx.font = `${fs(14)}px ${DECO}`; ctx.fillText("$" + stats.cash.toLocaleString(), f.x + 78 * s, base);

    ctx.textAlign = "right"; ctx.font = `${fs(9)}px ${TYPE}`;
    ctx.fillText(WEAP[p.weapon].name + (p.has[1] && p.has[0] ? "   [Q]" : ""), f.x + f.w - 18 * s, base - 13 * s);
    ctx.font = `${fs(17)}px ${DECO}`;

  }

  // ---------- Title cards ----------
  let card = null;

    else if (c.kind === "dead") { player.hp = 100; startLevel(c.idx, true); }
    else if (c.kind === "end") { Object.assign(stats, { kills: 0, cash: 0, shots: 0, hits: 0, deaths: 0, time: 0 }); player = null; showCard("chapter", 0); }
  }
  function startLevel(i, retry) {

    if (!isTouch && cv.requestPointerLock) { try { const p = cv.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
    if (isTouch) { fireBtn.style.display = "block"; swapBtn.style.display = "block"; }
  }
  function fadeOut(fn, dur = 0.8) { fadeDir = -1 / dur; after = fn; }

  function corner(x, y, sx, sy, s) {

    ctx.strokeStyle = CREAM; ctx.lineWidth = 1.2;
    for (let i = 0; i < 5; i++) { const a = i * Math.PI / 8; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 26 * s, Math.sin(a) * 26 * s); ctx.stroke(); }

  }
  function drawCard(t) {
    const f = film, s = f.s;
    ctx.fillStyle = "#0b0a09"; ctx.fillRect(f.x, f.y, f.w, f.h);
    const m = 22 * s;
    ctx.strokeStyle = CREAM; ctx.lineWidth = 2; ctx.strokeRect(f.x + m, f.y + m, f.w - m * 2, f.h - m * 2);
    ctx.lineWidth = 0.8; ctx.strokeRect(f.x + m + 6 * s, f.y + m + 6 * s, f.w - m * 2 - 12 * s, f.h - m * 2 - 12 * s);
    corner(f.x + m + 6 * s, f.y + m + 6 * s, 1, 1, s); corner(f.x + f.w - m - 6 * s, f.y + m + 6 * s, -1, 1, s);
    corner(f.x + m + 6 * s, f.y + f.h - m - 6 * s, 1, -1, s); corner(f.x + f.w - m - 6 * s, f.y + f.h - m - 6 * s, -1, -1, s);
    const cx = f.x + f.w / 2, Y = v => f.y + v * s;
    const line = (txt, y, font, a = 1) => { ctx.globalAlpha = a; ctx.font = font; ctx.fillStyle = CREAM; ctx.textAlign = "center"; ctx.fillText(txt, cx, Y(y)); ctx.globalAlpha = 1; };
    const blink = 0.45 + 0.4 * Math.sin(t * 3);
    if (state === "title") {
      line("A MOBBER PICTURE", 92, `${11 * s}px ${TYPE}`, 0.8);
      line("MOBBER", 150, `${58 * s}px ${DECO}`);
      line("~ a gangland picture in three reels ~", 180, `italic 700 ${13 * s}px ${SERIF}`);
      line("WASD move · mouse aim · click fire · R reload · Q swap guns", 232, `${9 * s}px ${TYPE}`, 0.75);
      line(isTouch ? "left thumb moves · right thumb looks · FIRE to shoot" : "Esc to pause · Shift to run", 248, `${9 * s}px ${TYPE}`, 0.6);
      line(isTouch ? "— tap to roll film —" : "— click to roll film —", 296, `${12 * s}px ${TYPE}`, blink);
    } else if (card.kind === "chapter") {
      const L = LEVELS[card.idx];
      line(L.chapter, 92, `${14 * s}px ${DECO}`, 0.85);
      line(L.title, 140, `italic 700 ${30 * s}px ${SERIF}`);
      L.card.forEach((c, i) => line(c, 186 + i * 20, `${12 * s}px ${TYPE}`, 0.9));
      line(isTouch ? "— tap to continue —" : "— click to continue —", 296, `${11 * s}px ${TYPE}`, blink);
    } else if (card.kind === "dead") {
      line("CUT!", 130, `${46 * s}px ${DECO}`);
      line(`They got you at ${LEVELS[card.idx].title}.`, 172, `italic 700 ${16 * s}px ${SERIF}`);
      line("The picture rewinds to the start of the reel.", 200, `${11 * s}px ${TYPE}`, 0.8);
      line(isTouch ? "— tap to roll it again —" : "— click to roll it again —", 296, `${11 * s}px ${TYPE}`, blink);
    } else if (card.kind === "end") {
      const acc = stats.shots ? Math.round(stats.hits / stats.shots * 100) : 0, mm = Math.floor(stats.time / 60), ss = Math.floor(stats.time % 60);
      line("THE END", 108, `${46 * s}px ${DECO}`);
      line("By morning the city had a new boss.", 146, `italic 700 ${16 * s}px ${SERIF}`);
      line(`${stats.kills} Vitale men down · $${stats.cash.toLocaleString()} collected · ${acc}% of shots on target`, 192, `${11 * s}px ${TYPE}`, 0.85);
      line(`Running time ${mm}:${String(ss).padStart(2, "0")} · retakes: ${stats.deaths}`, 212, `${11 * s}px ${TYPE}`, 0.85);
      line(isTouch ? "— tap to watch it again —" : "— click to watch it again —", 296, `${11 * s}px ${TYPE}`, blink);
    }
    // Grain over the card
    ctx.save(); ctx.globalAlpha = 0.09; ctx.globalCompositeOperation = "screen";
    ctx.drawImage(noiseCv, (Math.random() * 160) | 0, (Math.random() * 90) | 0, 480, 270, f.x, f.y, f.w, f.h);
    ctx.restore();
  }

  // ---------- Main loop ----------
  let last = performance.now(), t = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
    const paused = state === "play" && wasLocked && !locked && !isTouch;
    if ((state === "play" && !paused) || state === "dying") update(dt);
    if (fadeDir) {
      fade = clamp(fade + fadeDir * dt * (fadeDir > 0 ? 1.6 : 1), 0, 1);
      if (fadeDir < 0 && fade <= 0) { fadeDir = 0; const fn = after; after = null; if (fn) fn(); }
      else if (fadeDir > 0 && fade >= 1) fadeDir = 0;
    }
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, vw, vh);
    const flicker = 0.93 + Math.random() * 0.07;
    const jitter = Math.random() < 0.03 ? rand(-2, 2) : 0;
    if ((state === "play" || state === "dying") && lvl) {
      renderWorld(t);
      let bright = flicker * fade * (player.flash > 0 ? 1.25 : 1) * (1 - player.hurt * 1.2);
      if (state === "dying") bright *= 0.7;
      develop(Math.max(0.05, bright));
      const shake = player.hurt > 0 ? rand(-4, 4) * player.hurt * 3 : 0;
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(buf, film.x + shake, film.y + jitter + shake, film.w, film.h);
      projector();
      drawHUD();
    } else {
      ctx.save(); ctx.globalAlpha = state === "card" ? fade * flicker : flicker;
      drawCard(t);
      ctx.restore();
      projector(0.8);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // Exposed for automated play-testing
  window.__mobber = { get state() { return state; }, get player() { return player; }, get enemies() { return enemies; },
    get objs() { return objs; }, LEVELS, startLevel, wallAt: (x, y) => wallAt(x, y) };
})();
</script>
